name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project and security tools
        run: python -m pip install -e '.[dev]' bandit==1.9.4 pip-audit
      - name: Check high severity Python findings
        run: python -m bandit -r src -lll -f json -o bandit-report.json
      - name: Report dependency findings
        continue-on-error: true
        run: python -m pip_audit --format json --output pip-audit.json
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            pip-audit.json
            bandit-report.json
